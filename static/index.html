<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>HADES AI OS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- First Launch Overlay -->
    <div id="first-launch-overlay" class="first-launch-overlay" style="display: none;">
        <div class="first-launch-content">
            <div class="hades-visual-presence launch-visual">
                <div class="hologram-rings">
                    <div class="ring r1"></div>
                    <div class="ring r2"></div>
                    <div class="ring r3"></div>
                </div>
                <div class="core-glow"></div>
            </div>
            <div id="launch-dialogue" class="launch-dialogue">
                <p id="launch-text-1" class="launch-text fade-in">Hey. I'm Hades.</p>
                <p id="launch-text-2" class="launch-text fade-in" style="display: none; animation-delay: 1.5s;">Before we start, what should I call you?</p>
            </div>
            <div id="name-input-container" class="name-input-container fade-in" style="display: none; animation-delay: 3s;">
                <input type="text" id="user-name-input" placeholder="Your name..." autofocus autocomplete="off">
                <button id="save-name-btn"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>System Configuration</h2>
                <button id="close-settings-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p class="text-subtle">Hades intelligence configuration.</p>
                
                <div class="form-group">
                    <label>Gemini API Key</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="password" id="setting-gemini-key" placeholder="AIzaSy..." style="flex: 1;">
                        <button id="test-api-btn" class="secondary-btn">Test</button>
                    </div>
                    <p id="api-test-status" class="test-status" style="margin-top: 5px; font-size: 12px;"></p>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Wake Word</label>
                    <input type="text" id="setting-wake-word" value="Hades">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label class="toggle-label">
                        <input type="checkbox" id="setting-dev-mode"> Enable Developer Mode (Show Exceptions)
                    </label>
                </div>

                <button id="save-settings-btn" class="primary-btn" style="margin-top: 20px;">Save Configuration</button>
            </div>
        </div>
    </div>

    <div class="os-container">
        
        <!-- Floating Controls -->
        <div class="floating-controls">
            <button class="nav-item" id="nav-settings" title="Settings"><i class="fa-solid fa-gear"></i></button>
        </div>
        
        <!-- Contextual Mission Widget (Hidden unless active) -->
        <div id="contextual-mission-widget" class="mission-widget" style="display: none;">
            <div class="widget-header">
                <i class="fa-solid fa-rocket"></i> <span id="widget-mission-title">Active Mission</span>
            </div>
            <div id="widget-execution-log" class="widget-log">
                <!-- Status logs -->
            </div>
        </div>

        <!-- Main Workspace -->
        <main class="workspace">
            
            <!-- Central Intelligence Core -->
            <div id="hades-core-container" class="center-stage">
                <div id="hades-core" class="hades-visual-presence large idle">
                    <div class="hologram-rings">
                        <div class="ring r1"></div>
                        <div class="ring r2"></div>
                        <div class="ring r3"></div>
                        <div class="ring r4"></div>
                    </div>
                    <div class="core-glow"></div>
                </div>
            </div>

            <!-- Conversation -->
            <div class="conversation-container" id="chat-container">
                <!-- Messages will be appended here -->
            </div>

            <!-- Composer (Bottom) -->
            <footer class="composer-area">
                <div class="composer-box">
                    <textarea id="chat-input" placeholder="Talk to Hades..." rows="1" autofocus autocomplete="off"></textarea>
                    <button class="composer-send" id="send-btn" style="display: none;"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
                <div class="voice-status" id="voice-status-indicator">
                    <div class="pulse-dot"></div> Listening
                </div>
            </footer>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
